fileVersion: 1
id: "619"
isDisabled: false
metadata:
  defaultStorageLocation: null
  error: null
  nodeMetadataSpec: |-
    capitalized: TestStage
    short: STG
    plural: Stages
    tagColor: '#2EB67D'

    config:
    - groupName: Options
      items:
      - type: materializationSelector
        default: table
        options:
        - table
        - view
        isRequired: true

      - type: multisourceToggle
        enableIf: "{% if node.materializationType == 'table' %} true {% else %} false {% endif %}" 

      - type: overrideSQLToggle
        enableIf: "{% if node.materializationType == 'view' %} true {% else %} false {% endif %}"
        
      - displayName: Multi Source Strategy
        attributeName: insertStrategy
        type: dropdownSelector
        default: INSERT
        options:
        - "INSERT"
        - "UNION"
        - "UNION ALL"
        isRequired: true
        enableIf: "{% if node.isMultisource %} true {% else %} false {% endif %}"

      - displayName: Truncate Before
        attributeName: truncateBefore
        type: toggleButton
        default: true

      - displayName: Delete Before
        attributeName: deleteBefore
        type: toggleButton
        default: false

      - displayName: Delete Where Condition
        attributeName: deleteWhereCondition
        type: textBox
        syntax: sql
        isRequired: false
        enableIf: "{% if config.deleteBefore %} true {% else %} false {% endif %}"

      - displayName: Enable Tests
        attributeName: testsEnabled
        type: toggleButton
        default: true

        
      - displayName: Pre-SQL
        attributeName: preSQL
        type: textBox
        syntax: sql
        isRequired: false

      - displayName: Post-SQL
        attributeName: postSQL
        type: textBox
        syntax: sql
        isRequired: false

    - groupName: Quality Checks
      items:

      - displayName: Null Check
        attributeName: nullCheck
        type: toggleButton
        default: false
        isRequired: false

      - displayName: Null Check Column
        attributeName: nullCheckColumn
        type: columnDropdownSelector
        isRequired: false
        enableIf: "{% if config.nullCheck %} true {% else %} false {% endif %}"

      - displayName: Duplicate Check
        attributeName: duplicateCheck
        type: toggleButton
        default: false
        isRequired: false

      - displayName: Duplicate Check Column
        attributeName: duplicateCheckColumn
        type: columnDropdownSelector
        isRequired: false
        enableIf: "{% if config.duplicateCheck %} true {% else %} false {% endif %}"
name: TestStage
type: NodeType
